trigger:
  class: T2
  description: >
    Ba plaintext duoc chap nhan lien tiep co byte dau
    A5 -> 5A -> FF.
  activation: "Sequence of 3 accepted plaintexts with first bytes A5, 5A, FF"
  rarity: "2^-24 for the three-byte sequence"

payload:
