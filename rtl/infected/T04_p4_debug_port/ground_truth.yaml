  description: >
    Mo cong debug trai phep de xuat thong tin noi bo cua AES.
    debug_data gom FSM state, round counter, 90 bit datapath state
    va 32 bit round-key material.
  asset:
    - aes_internal_state
    - aes_round_key
  observable: logic
  outputs:
    valid: debug_valid
    data: debug_data

