case_id: T02_p2_slow_leak
base_design: aes_golden
author: team

trigger:
  class: T3
  description: Bo dem dat nguong 2^16 lan ma hoa
  activation: "counter >= 16'hFFFF"
  rarity: "2^-16"

payload:
  class: P2
  description: Ro 8 bit thap cua khoa vao result[7:0]
  asset: aes_key
  observable: logic

location:
  file: aes_core.v
  module: aes_core
  line_start: 76
  line_end: 81
  always_block: null

detection:
  expected_checker: KLG, ORC
  expected_latency: result-time
  rationale:
    ORC: >
      Tinh lai round cuoi doc lap (SubBytes->ShiftRows->AddRoundKey)
      roi so voi output core. P2 thay 8 bit thap cua result bang
      key[7:0] nen ORC bat moi lan ma hoa sau trigger (result-time).
    KLG: >
      Cua so thong ke 16 ket qua, nguong 6 lan trung byte thap
      khoa. Trigger counter bao hoa tai nguong nen moi lan ma hoa
      sau trigger deu ro byte khoa; KLG can 6 ket qua lien tiep
      (do do trigger_repeat = 6 trong muc verification).

verification:
  silent_under_nist: true
  # KLG detects the P2 leak through a sliding-window statistical test
  # (16 results, threshold 6 matches) instead of a single 8-bit
  # comparison, so the monitor needs several consecutive leaking
  # results before it alarms.
  #
  # The trigger counter saturates at the threshold, so every
  # encryption after the trigger has fired leaks the key byte. Six
  # repetitions are therefore enough to fill the window.
  trigger_repeat: 6
  activation_seq: verif/vectors/trigger_T02.txt
