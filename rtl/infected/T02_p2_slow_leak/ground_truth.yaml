case_id: T02_p2_slow_leak
base_design: aes_golden
author: team

trigger:
  class: T3
  description: Bo dem dat nguong 2^16 lan ma hoa
  activation: "counter >= 16'hFFFF"
  rarity: "2^-16"

payload:
  class: P2
  description: Ro 8 bit thap cua khoa vao result[7:0]
  asset: aes_key
  observable: logic

location:
  file: aes_core.v
  module: aes_core
  line_start: 76
  line_end: 81
  always_block: null

detection:
  expected_checker: KLG
  expected_latency: 1

verification:
  silent_under_nist: true
  # KLG detects the P2 leak through a sliding-window statistical test
  # (16 results, threshold 6 matches) instead of a single 8-bit
  # comparison, so the monitor needs several consecutive leaking
  # results before it alarms.
  #
  # The trigger counter saturates at the threshold, so every
  # encryption after the trigger has fired leaks the key byte. Six
  # repetitions are therefore enough to fill the window.
  trigger_repeat: 6
  activation_seq: verif/vectors/trigger_T02.txt
