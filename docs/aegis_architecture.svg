<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9534F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9302C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1ABC9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7F8C8D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#707B7C;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D9534F"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">Hình 1. Kiến trúc tổng thể AEGIS-AES</text>

  <rect x="200" y="55" width="500" height="60" rx="8" ry="8"
        fill="url(#gradBlue)" filter="url(#shadow)"/>
  <text x="450" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="white">aegis_aes_top.v</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#E8F4FD">6-state FSM wrapper · EN_ORC parameter</text>

  <rect x="30" y="70" width="130" height="32" rx="4" ry="4" fill="#ECF0F1" stroke="#95A5A6" stroke-width="1.5"/>
  <text x="95" y="82" text-anchor="middle" font-size="9" fill="#2C3E50">key[127:0]</text>
  <text x="95" y="94" text-anchor="middle" font-size="9" fill="#2C3E50">key_valid</text>
  <line x1="160" y1="86" x2="200" y2="86" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="115" width="130" height="32" rx="4" ry="4" fill="#ECF0F1" stroke="#95A5A6" stroke-width="1.5"/>
  <text x="95" y="127" text-anchor="middle" font-size="9" fill="#2C3E50">data_in[127:0]</text>
  <text x="95" y="139" text-anchor="middle" font-size="9" fill="#2C3E50">data_in_valid</text>
  <line x1="160" y1="131" x2="200" y2="131" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="160" width="130" height="22" rx="4" ry="4" fill="#ECF0F1" stroke="#95A5A6" stroke-width="1.5"/>
  <text x="95" y="175" text-anchor="middle" font-size="9" fill="#2C3E50">clk, rst_n</text>
  <line x1="160" y1="171" x2="200" y2="171" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="180" width="200" height="120" rx="8" ry="8"
        fill="url(#gradGray)" filter="url(#shadow)"/>
  <text x="340" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="white">aes_core_tapped</text>
  <text x="340" y="218" text-anchor="middle" font-size="9" fill="#F2F3F4">secworks/aes (golden)</text>
  <text x="340" y="234" text-anchor="middle" font-size="9" fill="#BDC3C7">BSD 2-Clause</text>
  <text x="340" y="252" text-anchor="middle" font-size="9" fill="#F2F3F4">key[255:0] · init · next</text>
  <text x="340" y="268" text-anchor="middle" font-size="9" fill="#F2F3F4">result[127:0] · result_valid</text>
  <text x="340" y="284" text-anchor="middle" font-size="9" fill="#F2F3F4">round_keys_flat[1407:0]</text>
  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#F2F3F4">muxed_round_nr[3:0]</text>

  <line x1="340" y1="115" x2="340" y2="180" stroke="#555" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="355" y="152" font-size="8" fill="#7F8C8D">init, next</text>

  <rect x="30" y="270" width="130" height="85" rx="6" ry="6"
        fill="url(#gradGreen)" filter="url(#shadow)"/>
  <text x="95" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="white">KLG</text>
  <text x="95" y="306" text-anchor="middle" font-size="8" fill="#E8F8F0">Key-Leak Guard</text>
  <line x1="160" y1="312" x2="200" y2="312" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="314" width="110" height="14" rx="3" fill="#A9DFBF" stroke="none"/>
  <text x="95" y="324" text-anchor="middle" font-size="8" fill="#1E8449">Tier1: khớp 128-bit</text>
  <rect x="40" y="331" width="110" height="14" rx="3" fill="#A9DFBF" stroke="none"/>
  <text x="95" y="341" text-anchor="middle" font-size="8" fill="#1E8449">Tier2: khớp 32-bit lane</text>
  <rect x="40" y="348" width="110" height="14" rx="3" fill="#A9DFBF" stroke="none"/>
  <text x="95" y="358" text-anchor="middle" font-size="8" fill="#1E8449">Tier3: Hamming &lt; 16</text>

  <line x1="240" y1="280" x2="160" y2="312" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="268" font-size="8" fill="#7F8C8D">result</text>

  <rect x="30" y="365" width="130" height="55" rx="6" ry="6"
        fill="url(#gradOrange)" filter="url(#shadow)"/>
  <text x="95" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="white">FIC</text>
  <text x="95" y="401" text-anchor="middle" font-size="8" fill="#FEF9E7">FSM Integrity Checker</text>
  <text x="95" y="413" text-anchor="middle" font-size="8" fill="#FEF9E7">$onehot · bảng chuyển</text>
  <line x1="160" y1="392" x2="200" y2="392" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="340" y1="171" x2="95" y2="392" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="190" y="185" font-size="8" fill="#7F8C8D">state</text>

  <rect x="30" y="430" width="130" height="60" rx="6" ry="6"
        fill="url(#gradPurple)" filter="url(#shadow)"/>
  <text x="95" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RCM</text>
  <text x="95" y="466" text-anchor="middle" font-size="8" fill="#F4ECF7">Round Consistency</text>
  <text x="95" y="478" text-anchor="middle" font-size="8" fill="#F4ECF7">Monitor · 0→10 tăng đơn điệu</text>
  <line x1="160" y1="460" x2="200" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="440" y1="296" x2="160" y2="460" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="300" font-size="8" fill="#7F8C8D">round_nr</text>

  <rect x="30" y="500" width="130" height="55" rx="6" ry="6"
        fill="url(#gradTeal)" filter="url(#shadow)"/>
  <text x="95" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RED</text>
  <text x="95" y="536" text-anchor="middle" font-size="8" fill="#E8F8F5">Rare-Event Detector</text>
  <text x="95" y="548" text-anchor="middle" font-size="8" fill="#E8F8F5">toggle-coverage</text>
  <line x1="160" y1="527" x2="200" y2="527" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="270" width="130" height="55" rx="6" ry="6"
        fill="url(#gradOrange)" filter="url(#shadow)"/>
  <text x="585" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="white">ORC</text>
  <text x="585" y="306" text-anchor="middle" font-size="8" fill="#FEF9E7">Output Redundancy</text>
  <text x="585" y="318" text-anchor="middle" font-size="8" fill="#FEF9E7">Checker · nhân bản SB-SR-ARK</text>
  <rect x="540" y="325" width="90" height="16" rx="3" fill="#FAD7A0" stroke="#EC971F" stroke-width="1"/>
  <text x="585" y="336" text-anchor="middle" font-size="8" fill="#7D6608">EN_ORC = 1</text>
  <line x1="440" y1="312" x2="520" y2="312" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="300" y="365" width="280" height="135" rx="10" ry="10"
        fill="url(#gradRed)" filter="url(#shadow)"/>
  <text x="440" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="white">TRU — Tamper Response Unit</text>

  <rect x="315" y="393" width="250" height="60" rx="6" ry="6" fill="#FAD7A0" stroke="#C0392B" stroke-width="1"/>
  <text x="440" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B241C">FSM 3 trạng thái</text>
  <text x="440" y="424" text-anchor="middle" font-size="9" fill="#922B21">NORMAL → SUSPECT → LOCKDOWN</text>
  <text x="440" y="440" text-anchor="middle" font-size="9" fill="#922B21">LOCKDOWN sticky: only reset exits</text>

  <rect x="315" y="458" width="80" height="20" rx="4" fill="#F5B7B1" stroke="#C0392B" stroke-width="1"/>
  <text x="355" y="471" text-anchor="middle" font-size="9" fill="#922B21">sec_alarm</text>
  <rect x="405" y="458" width="80" height="20" rx="4" fill="#FDEBD0" stroke="#C0392B" stroke-width="1"/>
  <text x="445" y="471" text-anchor="middle" font-size="9" fill="#922B21">sec_warning</text>
  <rect x="495" y="458" width="70" height="20" rx="4" fill="#FDEDEC" stroke="#C0392B" stroke-width="1"/>
  <text x="530" y="471" text-anchor="middle" font-size="9" fill="#922B21">sec_status</text>

  <rect x="315" y="483" width="120" height="18" rx="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  <text x="375" y="496" text-anchor="middle" font-size="9" fill="white">zeroize ← xóa khóa</text>
  <rect x="445" y="483" width="120" height="18" rx="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  <text x="505" y="496" text-anchor="middle" font-size="9" fill="white">block_output</text>

  <line x1="160" y1="327" x2="300" y2="393" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="350" font-size="9" fill="#27AE60">klg_alarm</text>

  <line x1="160" y1="412" x2="300" y2="412" stroke="#F39C12" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="408" font-size="9" fill="#F39C12">fic_alarm</text>

  <line x1="160" y1="475" x2="300" y2="475" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="470" font-size="9" fill="#8E44AD">rcm_alarm</text>

  <line x1="160" y1="542" x2="300" y2="480" stroke="#1ABC9C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="520" font-size="9" fill="#1ABC9C">red_warning</text>

  <line x1="520" y1="297" x2="470" y2="400" stroke="#F39C12" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="340" font-size="9" fill="#F39C12">orc_alarm</text>

  <line x1="340" y1="365" x2="340" y2="300" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="350" y="340" font-size="9" fill="#E74C3C">zeroize → reset_n</text>

  <line x1="450" y1="115" x2="450" y2="95" stroke="#555" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="385" y="115" width="130" height="40" rx="4" ry="4" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
  <text x="450" y="130" text-anchor="middle" font-size="9" fill="#1E8449">data_out[127:0]</text>
  <text x="450" y="144" text-anchor="middle" font-size="9" fill="#1E8449">data_out_valid · busy</text>
  <line x1="450" y1="155" x2="450" y2="180" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <line x1="580" y1="115" x2="580" y2="95" stroke="#555" stroke-width="1.5"/>
  <rect x="530" y="115" width="100" height="40" rx="4" ry="4" fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5"/>
  <text x="580" y="130" text-anchor="middle" font-size="9" fill="#922B21">sec_alarm</text>
  <text x="580" y="144" text-anchor="middle" font-size="9" fill="#922B21">sec_warning · sec_status</text>
  <line x1="580" y1="115" x2="580" y2="55" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <line x1="475" y1="500" x2="600" y2="65" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>

  <rect x="30" y="575" width="840" height="90" rx="6" ry="6" fill="#F8F9FA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="450" y="593" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">Chú thích · Legend</text>

  <rect x="45" y="600" width="14" height="14" rx="3" fill="url(#gradBlue)"/>
  <text x="65" y="612" font-size="9" fill="#2C3E50">Wrapper (aegis_aes_top)</text>

  <rect x="45" y="620" width="14" height="14" rx="3" fill="url(#gradGray)"/>
  <text x="65" y="632" font-size="9" fill="#2C3E50">Lõi AES golden (secworks/aes, không sửa)</text>

  <rect x="250" y="600" width="14" height="14" rx="3" fill="url(#gradGreen)"/>
  <text x="270" y="612" font-size="9" fill="#2C3E50">KLG – Key-Leak Guard (P1, P2)</text>

  <rect x="250" y="620" width="14" height="14" rx="3" fill="url(#gradOrange)"/>
  <text x="270" y="632" font-size="9" fill="#2C3E50">FIC – FSM Integrity (T4, P4) · ORC (P2, P3)</text>

  <rect x="520" y="600" width="14" height="14" rx="3" fill="url(#gradPurple)"/>
  <text x="540" y="612" font-size="9" fill="#2C3E50">RCM – Round Consistency (P3, P5)</text>

  <rect x="520" y="620" width="14" height="14" rx="3" fill="url(#gradTeal)"/>
  <text x="540" y="632" font-size="9" fill="#2C3E50">RED – Rare-Event (T1, T2, T3)</text>

  <rect x="710" y="600" width="14" height="14" rx="3" fill="url(#gradRed)"/>
  <text x="730" y="612" font-size="9" fill="#2C3E50">TRU – Tamper Response</text>
  <text x="730" y="626" font-size="9" fill="#2C3E50">(SUSPECT → LOCKDOWN)</text>

  <line x1="45" y1="645" x2="80" y2="645" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="648" font-size="8" fill="#2C3E50">Dòng dữ liệu / datapath</text>

  <line x1="210" y1="645" x2="245" y2="645" stroke="#27AE60" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="253" y="648" font-size="8" fill="#2C3E50">Tín hiệu điều khiển</text>

  <line x1="370" y1="645" x2="405" y2="645" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="413" y="648" font-size="8" fill="#2C3E50">zeroize → reset nội bộ</text>

  <text x="600" y="648" font-size="8" fill="#7F8C8D">Payload: P1=rò khóa, P2=rò chậm, P3=sai lệch, P4=bypass, P5=DoS</text>
</svg>
